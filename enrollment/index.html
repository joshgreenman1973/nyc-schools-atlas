                                <span style={{ fontSize: '13px', fontWeight: 900, color: '#050507', fontVariantNumeric: 'tabular-nums', minWidth: '56px', textAlign: 'right' }}>{animated[animated.length - 1].year}</span>
                            </div>
                            <label style={{ display: 'flex', alignItems: 'center', gap: '6px', fontSize: '12px', cursor: 'pointer' }}>
                                <input type="checkbox" checked={wfIndexed} onChange={e => setWfIndexed(e.target.checked)} />
                                Show as % change since each line's first year
                            </label>
                            <label style={{ display: 'flex', alignItems: 'center', gap: '6px', fontSize: '12px', cursor: 'pointer' }}>
                                <input type="checkbox" checked={workforceYZero} onChange={e => setWorkforceYZero(e.target.checked)} />
                                Y-axis from zero
                            </label>
                        </div>

                        <div style={{ fontSize: '11px', color: '#707175', marginBottom: '10px' }}>Source: NYC IBO (teachers), NYC OMB (total headcount), NYC DOE Demographic Snapshot (enrollment)</div>

                        <div style={{ height: '420px', width: '100%' }}>
                            <ResponsiveContainer width="100%" height="100%">
                                <ComposedChart data={chartData} margin={{ top: 10, right: 60, left: 10, bottom: 0 }}>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#eee" />
                                    <XAxis dataKey="year" tick={{ fill: '#707175', fontSize: 11 }} axisLine={false} tickLine={false} />
                                    <YAxis yAxisId="staff" tickFormatter={wfIndexed ? (v => v.toFixed(0) + '%') : formatYAxis} tick={{ fill: '#707175', fontSize: 11 }} axisLine={false} tickLine={false} width={50} domain={wfIndexed ? [70, 220] : (workforceYZero ? [0, 'auto'] : ['auto', 'auto'])} label={{ value: wfIndexed ? '% of first year' : 'Staff', angle: -90, position: 'insideLeft', fill: '#707175', fontSize: 11 }} />
                                    <YAxis yAxisId="students" orientation="right" tickFormatter={wfIndexed ? (v => v.toFixed(0) + '%') : formatYAxis} tick={{ fill: '#707175', fontSize: 11 }} axisLine={false} tickLine={false} width={50} domain={wfIndexed ? [70, 220] : (workforceYZero ? [0, 'auto'] : ['auto', 'auto'])} label={{ value: wfIndexed ? '% of first year' : 'Students', angle: 90, position: 'insideRight', fill: '#707175', fontSize: 11 }} />
                                    {wfIndexed && <ReferenceLine yAxisId="staff" y={100} stroke="#bbb" strokeDasharray="2 4" />}
                                    <Tooltip wrapperStyle={{ outline: 'none' }} content={({ active, payload, label }) => {
                                        if (!active || !payload || !payload.length) return null;
                                        var shortName = (n) => n.replace(/ \(.+?\)/, '');
                                        return (
                                            <div style={{ background: 'rgba(5,5,7,0.96)', color: '#fff', padding: '8px 10px', fontFamily: 'var(--font-primary)', boxShadow: '0 4px 16px rgba(0,0,0,0.24)', fontSize: '11px', lineHeight: 1.3 }}>
                                                <div style={{ fontWeight: 800, fontSize: '12px', marginBottom: '4px' }}>{label}</div>
                                                {payload.map((e, i) => (
                                                    <div key={i} style={{ display: 'flex', alignItems: 'center', marginBottom: '1px', whiteSpace: 'nowrap' }}>
                                                        <div style={{ width: '7px', height: '7px', borderRadius: '50%', background: e.color, marginRight: '6px', flexShrink: 0 }} />
                                                        <span style={{ color: 'rgba(255,255,255,0.7)', marginRight: '10px' }}>{shortName(e.name)}</span>
                                                        <span style={{ fontWeight: 700, marginLeft: 'auto', fontVariantNumeric: 'tabular-nums' }}>{wfIndexed ? e.value.toFixed(1) + '%' : e.value.toLocaleString()}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        );
                                    }} />
                                    <Legend iconType="square" iconSize={10} wrapperStyle={{ paddingTop: '16px', fontSize: '12px' }} />
                                    <Line yAxisId="staff" type="monotone" dataKey="genEd" name="General-education teachers (district)" stroke="#394882" strokeWidth={2.5} dot={{ r: 3 }} isAnimationActive={false} />
                                    <Line yAxisId="staff" type="monotone" dataKey="sped" name="Special-education teachers (district)" stroke="#9b9fbc" strokeWidth={2.5} dot={{ r: 3 }} isAnimationActive={false} />
                                    <Line yAxisId="staff" type="monotone" dataKey="otherPed" name="Other pedagogical (paras, counselors, Pre-K, etc.)" stroke="#e7466d" strokeWidth={2.5} dot={{ r: 3 }} isAnimationActive={false} />
                                    <Line yAxisId="staff" type="monotone" dataKey="nonPed" name="Non-pedagogical (school aides, secretaries, etc.)" stroke="#707175" strokeWidth={2} strokeDasharray="4 4" dot={{ r: 3 }} isAnimationActive={false} />
                                    <Line yAxisId="students" type="monotone" dataKey="enrollment" name="Student enrollment (district)" stroke="#dde44c" strokeWidth={3} dot={{ r: 3 }} isAnimationActive={false} />
                                </ComposedChart>
                            </ResponsiveContainer>
                        </div>
                                </React.Fragment>
                            );
                        })()}

                        <h3 style={{ fontSize: '17px', fontWeight: 900, letterSpacing: '-0.02em', marginTop: '40px', marginBottom: '4px' }}>
                            Staff per 1,000 students, and students per teacher
                        </h3>
                        <p style={{ fontSize: '13px', color: '#707175', marginBottom: '20px' }}>
                            When students fall faster than staff, ratios shift. These three measures show by how much.
                        </p>

                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '16px' }}>
                            {[
                                { key: 'studentsPerTeacher', name: 'Students per district teacher', color: '#394882', fmt: v => v == null ? '' : v.toFixed(1) },
                                { key: 'parasAndStaffPer1k', name: 'Other pedagogical staff per 1,000 students', color: '#e7466d', fmt: v => v == null ? '' : v.toFixed(1) },
                                { key: 'nonPedPer1k', name: 'Non-pedagogical staff per 1,000 students', color: '#707175', fmt: v => v == null ? '' : v.toFixed(1) },
                            ].map(spec => (
                                <div key={spec.key} style={{ border: '1px solid #ddd', padding: '16px', background: '#fff' }}>
                                    <div style={{ fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.08em', color: '#707175', marginBottom: '4px' }}>{spec.name}</div>
                                    {(() => {
                                        var first = workforceData.find(d => d[spec.key] != null);
                                        var last = workforceData[workforceData.length - 1];
                                        return (
                                            <div style={{ fontSize: '13px', color: '#050507', marginBottom: '8px' }}>
                                                <span style={{ fontVariantNumeric: 'tabular-nums', fontWeight: 700 }}>{spec.fmt(first[spec.key])}</span>
                                                <span style={{ color: '#707175' }}> ({first.year}) </span>
                                                <span style={{ color: '#707175' }}>&rarr; </span>
                                                <span style={{ fontVariantNumeric: 'tabular-nums', fontWeight: 700 }}>{spec.fmt(last[spec.key])}</span>
                                                <span style={{ color: '#707175' }}> ({last.year})</span>
                                            </div>
                                        );
                                    })()}
                                    <div style={{ height: '160px' }}>
                                        <ResponsiveContainer width="100%" height="100%">
                                            <LineChart data={workforceData} margin={{ top: 6, right: 6, left: 0, bottom: 0 }}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#eee" />
                                                <XAxis dataKey="year" tick={{ fill: '#707175', fontSize: 10 }} axisLine={false} tickLine={false} interval={1} />
                                                <YAxis tickFormatter={spec.fmt} tick={{ fill: '#707175', fontSize: 10 }} axisLine={false} tickLine={false} width={36} domain={workforceYZero ? [0, 'auto'] : ['auto', 'auto']} />
                                                <Tooltip formatter={(v) => spec.fmt(v)} />
                                                <Line type="monotone" dataKey={spec.key} stroke={spec.color} strokeWidth={2.5} dot={{ r: 3 }} isAnimationActive={false} name={spec.name} />
                                            </LineChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <h3 style={{ fontSize: '17px', fontWeight: 900, letterSpacing: '-0.02em', marginTop: '40px', marginBottom: '4px' }}>
                            What is inside "other pedagogical"? A 2019-20 snapshot
                        </h3>
                        <p style={{ fontSize: '13px', color: '#707175', marginBottom: '20px' }}>
                            The DOE's November 2019 Local Law 226 headcount report is the only recent year with a clean public decomposition of school-based staff. It does not break out central / non-school-based instructional specialists, which the budget documents place in a separate "categorical" pedagogical bucket of roughly 4,000 to 7,000 positions.
                        </p>

                        <div style={{ height: '320px', width: '100%' }}>
                            <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={workforceSnapshot2019} layout="vertical" margin={{ top: 10, right: 30, left: 100, bottom: 10 }}>
                                    <CartesianGrid strokeDasharray="3 3" horizontal={false} stroke="#eee" />
                                    <XAxis type="number" tickFormatter={formatYAxis} tick={{ fill: '#707175', fontSize: 11 }} axisLine={false} tickLine={false} />
                                    <YAxis type="category" dataKey="role" tick={{ fill: '#050507', fontSize: 12 }} axisLine={false} tickLine={false} width={140} />
                                    <Tooltip formatter={(v) => v.toLocaleString()} />
                                    <Bar dataKey="count" fill="#e7466d" isAnimationActive={false} radius={[0, 3, 3, 0]} />
                                </BarChart>
                            </ResponsiveContainer>
                        </div>

                        <div style={{ background: '#f8f8f8', border: '1px solid #ddd', padding: '16px 20px', marginTop: '24px', fontSize: '12px', color: '#707175', lineHeight: 1.6 }}>
                            <div style={{ fontWeight: 700, marginBottom: '6px', color: '#050507', fontSize: '11px', textTransform: 'uppercase', letterSpacing: '0.08em' }}>What this chart can and cannot show</div>
                            <ul style={{ margin: 0, paddingLeft: '18px' }}>
                                <li>Year-by-year district teacher counts come from the NYC Independent Budget Office (IBO), September 2023, using individual-level DOE data. They cover traditional public (district) schools only, not charter schools.</li>
                                <li>"Other pedagogical" is computed as: total NYC DOE pedagogical headcount (NYC Office of Management and Budget, OMB) minus general-education and special-education teachers (IBO). This bucket contains paraprofessionals, counselors, social workers, school psychologists, librarians, principals and assistant principals, Pre-K and 3-K teachers, and central / field-office pedagogical staff. It cannot be broken out by year in publicly released sources at the granularity requested.</li>
                                <li>Charter-school teachers are not included. NYSED publishes charter teacher counts but only as part of statewide BEDS personnel files, which require additional processing. Charter enrollment is shown on the Composition tab.</li>
                                <li>Pre-K and 3-K teachers are included inside "other pedagogical." The OMB pedagogical breakdown for fiscal 2024 reports 6,605 actual Early Childhood pedagogical positions, 1,515 in School Support and Other, and 4,441 in Categorical Programs (which includes the Absent Teacher Reserve and centrally funded specialists).</li>
                                <li>To get year-by-year counts of paraprofessionals, central / non-school-based instructional staff, or charter teachers specifically would require a Freedom of Information Law (FOIL) request to the NYC Department of Education or processing of NYSED Personnel Master File raw data.</li>
                            </ul>
                        </div>

                        <div style={{ marginTop: '16px', fontSize: '11px', color: '#707175' }}>
                            <span style={{ fontWeight: 600 }}>Sources:</span>{' '}
                            <a href="https://www.ibo.nyc.ny.us/iboreports/roll-call-recent-trends-in-teacher-retention-and-hiring-in-new-york-city-public-schools-september-2023.pdf" style={{ color: '#707175', textDecoration: 'underline' }}>IBO, Roll Call (Sept. 2023)</a>,{' '}
                            <a href="https://council.nyc.gov/budget/wp-content/uploads/sites/54/2024/03/040-DOE.pdf" style={{ color: '#707175', textDecoration: 'underline' }}>NYC Council Finance Division, DOE FY25 Preliminary Budget</a>,{' '}
                            <a href="https://council.nyc.gov/budget/wp-content/uploads/sites/54/2020/04/040-DOE.pdf" style={{ color: '#707175', textDecoration: 'underline' }}>NYC Council, DOE FY21 Executive Budget</a>,{' '}
                            <a href="https://infohub.nyced.org/reports/government-reports/report-on-school-based-staff-demographics" style={{ color: '#707175', textDecoration: 'underline' }}>NYC DOE School-Based Staff Demographics</a>,{' '}
                            <a href="https://infohub.nyced.org/" style={{ color: '#707175', textDecoration: 'underline' }}>NYC DOE InfoHub</a>
                        </div>
                    </div>}

                    {/* TAB 6: METHODOLOGY */}
                    {activeTab === 'methodology' && <div>
                        <h2 style={{ fontSize: '22px', fontWeight: 900, letterSpacing: '-0.02em', marginBottom: '20px' }}>
                            Methodology and data notes
                        </h2>

                        <div style={{ fontSize: '14px', color: '#050507', lineHeight: 1.7, fontFamily: 'var(--font-secondary)' }}>

                            <div style={{ marginBottom: '32px' }}>
                                <h3 style={{ fontSize: '15px', fontWeight: 700, fontFamily: 'var(--font-primary)', textTransform: 'uppercase', letterSpacing: '0.06em', color: '#707175', marginBottom: '10px' }}>K-12 composition (1940-2025)</h3>
                                <p style={{ marginBottom: '10px' }}>This chart shows estimated total K-12 enrollment across five sectors: traditional public schools (NYC DOE), charter schools, religious/parochial schools, independent secular private schools, and homeschool.</p>
                                <p style={{ marginBottom: '10px' }}><strong>Post-2000 data</strong> for public and charter schools comes from NYC DOE enrollment reports published on InfoHub and the NYS Education Department. These are audited enrollment counts taken on the official BEDS (Basic Educational Data System) Day each fall.</p>
                                <p style={{ marginBottom: '10px' }}><strong>Pre-2000 data are historical estimates.</strong> There is no single dataset covering all NYC school sectors back to 1940. Pre-2000 figures are assembled from historical DOE reports, NYC Independent Budget Office analyses, NYSED archives, and academic sources. Figures for the 1940s-1960s are rounded approximations and should be understood as showing broad trends, not precise counts.</p>
                                <p style={{ marginBottom: '10px' }}><strong>Private school enrollment</strong> (both religious and secular) is always an estimate. Private schools in New York State file basic enrollment data with NYSED, but reporting completeness varies. The Archdiocese of New York and Diocese of Brooklyn publish enrollment figures for Catholic schools; other religious school networks (yeshivas, Islamic schools, etc.) are harder to count precisely. The "religious/parochial" category includes all religiously affiliated schools.</p>
                                <p style={{ marginBottom: '10px' }}><strong>Homeschool numbers</strong> are the most uncertain. New York State requires families to file an Individualized Home Instruction Plan (IHIP) with their local school district. The DOE publishes some counts, but compliance with filing requirements is uneven, and actual homeschooling likely exceeds filed IHIPs. The spike during 2020-2021 reflects both increased filing and media-reported estimates.</p>
                                <p><strong>Charter schools</strong> first appeared in NYC in 1999 following the NYS Charter Schools Act of 1998. Charter students are publicly funded but shown separately from DOE-operated schools.</p>
                            </div>

                            <div style={{ marginBottom: '32px' }}>
                                <h3 style={{ fontSize: '15px', fontWeight: 700, fontFamily: 'var(--font-primary)', textTransform: 'uppercase', letterSpacing: '0.06em', color: '#707175', marginBottom: '10px' }}>Early childhood (Pre-K / 3-K)</h3>
                                <p style={{ marginBottom: '10px' }}>Pre-K data begins in 2012, covering both DOE-operated and community-based organization (CBO) seats. Universal Pre-K launched citywide in fall 2014 under Mayor de Blasio. 3-K for All began in 2017 in select districts and expanded citywide.</p>
                                <p style={{ marginBottom: '10px' }}>Enrollment figures come from NYC DOE Demographic Snapshots published on InfoHub. These count filled seats, not available seats -- the gap between capacity and enrollment has widened in recent years, particularly for 3-K.</p>
                                <p>The decline in both Pre-K and 3-K enrollment since their respective peaks reflects falling birth rates in NYC (births dropped from ~123,000 in 2016 to ~99,000 in 2022) as well as competition from private early childhood providers.</p>
                            </div>

                            <div style={{ marginBottom: '32px' }}>
                                <h3 style={{ fontSize: '15px', fontWeight: 700, fontFamily: 'var(--font-primary)', textTransform: 'uppercase', letterSpacing: '0.06em', color: '#707175', marginBottom: '10px' }}>Public enrollment by grade</h3>
                                <p style={{ marginBottom: '10px' }}>The grade-level comparison shows DOE-operated public school enrollment only (not charter schools) for 2019 vs. 2025. Source: DOE InfoHub enrollment reports.</p>
                                <p>The pattern of steeper declines in lower grades reflects both the ongoing birth rate decline and pandemic-era departures that hit younger cohorts hardest. As these smaller cohorts age up, the enrollment wave will continue moving through upper grades.</p>
                            </div>

                            <div style={{ marginBottom: '32px' }}>
                                <h3 style={{ fontSize: '15px', fontWeight: 700, fontFamily: 'var(--font-primary)', textTransform: 'uppercase', letterSpacing: '0.06em', color: '#707175', marginBottom: '10px' }}>Chronic absenteeism</h3>
                                <p style={{ marginBottom: '10px' }}>Chronic absenteeism is defined as a student missing 10% or more of enrolled school days in a given year (typically 18+ days out of 180). This chart uses the NYSED-aligned definition, which excludes suspensions and extended medical absences from the absence count.</p>
                                <p style={{ marginBottom: '10px' }}>The DOE formally adopted the NYSED definition starting in 2020-21 but retroactively applied it to data from 2016-17 onward. Only 2018-19 is shown as the pre-pandemic baseline because it is the last full school year with reliable data and is widely cited in published analyses.</p>
                                <p style={{ marginBottom: '10px' }}><strong>2019-20 is excluded entirely</strong> because schools closed in mid-March 2020 and the DOE did not publish end-of-year attendance data. <strong>2020-21 is shown but flagged</strong>: with 61% of students fully remote, attendance tracking was inconsistent across schools, and the reported 30% rate likely understates actual disengagement.</p>
                                <p>Because NYS excludes suspensions from its definition, these rates are not directly comparable to federal chronic absenteeism data from the U.S. Department of Education, which counts all absences regardless of reason.</p>
                            </div>

                            <div style={{ marginBottom: '32px' }}>
                                <h3 style={{ fontSize: '15px', fontWeight: 700, fontFamily: 'var(--font-primary)', textTransform: 'uppercase', letterSpacing: '0.06em', color: '#707175', marginBottom: '10px' }}>Workforce</h3>
                                <p style={{ marginBottom: '10px' }}>The Workforce tab compares NYC public-school staffing to student enrollment in the same district schools, school years 2000-01 through 2022-23. It draws on four independent sources stitched together year by year.</p>
                                <p style={{ marginBottom: '10px' }}><strong>District classroom teachers</strong> (general education and special education) come from two New York City Independent Budget Office (IBO) reports: the May 2014 fiscal brief "Demographics and Work Experience: A Statistical Portrait of New York City's Public School Teachers" (Table 1) for school years 2000-01 through 2011-12, and the September 2023 brief "Roll Call: Recent Trends in Teacher Retention &amp; Hiring in New York City Public Schools" for school years 2015-16 through 2022-23. Both IBO series are built from individual teacher-level data obtained from the DOE under data-use agreements and cover teachers in DOE-operated traditional public schools only (charter teachers excluded). The intermediate three years (2012-13, 2013-14, 2014-15) are not in either published report and are shown as <strong>linear interpolations</strong> between the IBO endpoints; they are flagged on the tab.</p>
                                <p style={{ marginBottom: '10px' }}><strong>Total DOE pedagogical and non-pedagogical headcount</strong> come from the New York City Office of Management and Budget (OMB) actual headcount tables, as reproduced in the NYC Council Finance Division briefing paper on the DOE Fiscal 2025 Preliminary Budget (March 2024), Charts 6 and 7. OMB uses fiscal year (July to June); we map fiscal year N to school year N-1 to N. Pedagogical positions include all licensed teachers, paraprofessionals, counselors, social workers, school psychologists, librarians, and principals/assistant principals across the entire DOE, including any pedagogical positions in central and field offices. Non-pedagogical positions include school aides, secretaries, and DOE central administration civilian staff.</p>
                                <p style={{ marginBottom: '10px' }}><strong>"Other pedagogical"</strong> is computed: total DOE pedagogical headcount (OMB) minus district general-education teachers minus district special-education teachers (both IBO). This residual contains paraprofessionals, school-based pupil-services staff (counselors, social workers, school psychologists, librarians), school leadership (principals and assistant principals), Pre-K and 3-K teachers, and any pedagogical positions assigned to DOE central or field offices. Year-by-year breakdowns of this bucket at finer granularity are not published. The DOE's November 2019 Local Law 226 headcount report is the only recent year that publicly decomposes the school-based portion (72,158 teachers, 16,426 paraprofessionals, 5,580 school aides, 2,728 guidance counselors, 1,640 principals, 860 social workers, 513 school psychologists). The OMB FY24 actual breakdown by program area places about 4,441 pedagogical positions in Categorical Programs (includes the Absent Teacher Reserve and centrally funded specialists) and 1,515 in School Support and Other, totaling roughly 6,000 non-school-based pedagogical positions in fiscal 2024.</p>
                                <p style={{ marginBottom: '10px' }}><strong>Student enrollment</strong> is the K-12 total in DOE-operated traditional public schools. Endpoint figures (1,105,240 in 2000-01; 1,041,437 in 2011-12; 881,000 in 2022-23) come from the same IBO reports cited above. Years between IBO observations are linear interpolations of district enrollment. The intermediate values match the DOE Demographic Snapshot annual figures within roughly one percent. Charter, religious, secular private, and homeschool students are excluded so that the denominator matches the staff numerator.</p>
                                <p style={{ marginBottom: '10px' }}><strong>Charter teachers and Pre-K/3-K teachers as separate lines.</strong> The original plan called for these to be broken out as their own colored lines. They are not. Charter-school teacher counts by year are published only inside NYSED Basic Educational Data System (BEDS) Personnel Master File downloads, which require additional processing beyond the scope of this update. Pre-K and 3-K teachers are reported by the DOE in aggregate program totals (8,024 budgeted / 6,605 actual in fiscal 2024) but the public IBO and OMB time series do not separate them from other teachers across all eight years on a comparable basis. Both categories are folded into "other pedagogical" for now and noted explicitly on the tab.</p>
                                <p style={{ marginBottom: '10px' }}><strong>Fiscal year vs. school year alignment.</strong> IBO teacher counts are by school year (October to October). OMB headcount is by fiscal year (June end-of-year actual). For chart alignment, OMB fiscal year N is plotted at school year N-1 to N. The two series will not match exactly because OMB's pedagogical total includes paraprofessionals and other staff that IBO does not classify as teachers, and because the snapshot dates differ by a few months.</p>
                                <p><strong>What this means for the user's question.</strong> The user asked whether paraprofessionals and non-school-based "roaming" instructional staff grew while students declined. The published data answer the broader version of the question: the "other pedagogical" bucket (which contains both groups) was 39,450 in 2015-16 and 41,006 in 2022-23, while district enrollment fell from about 979,000 to about 881,000 students. That implies a rise from 40 to 47 such staff per 1,000 students, or 16 percent more per pupil. To isolate paraprofessional and central-office headcount specifically, the next step would be a FOIL request to the DOE's Division of Human Resources or processing of the NYSED BEDS Personnel Master File raw downloads.</p>
                            </div>

                            <div style={{ borderTop: '1px solid #ddd', paddingTop: '20px' }}>
                                <h3 style={{ fontSize: '15px', fontWeight: 700, fontFamily: 'var(--font-primary)', textTransform: 'uppercase', letterSpacing: '0.06em', color: '#707175', marginBottom: '10px' }}>Sources</h3>
                                <ul style={{ margin: 0, paddingLeft: '18px', color: '#707175', fontSize: '13px' }}>
                                    <li style={{ marginBottom: '6px' }}><a href="https://infohub.nyced.org/" style={{ color: '#394882' }}>NYC DOE InfoHub</a> -- enrollment reports, demographic snapshots, attendance data</li>
                                    <li style={{ marginBottom: '6px' }}><a href="https://data.nysed.gov/" style={{ color: '#394882' }}>NYS Education Department</a> -- BEDS enrollment, accountability data</li>
                                    <li style={{ marginBottom: '6px' }}><a href="https://ibo.nyc.ny.us/" style={{ color: '#394882' }}>NYC Independent Budget Office</a> -- historical enrollment analyses</li>
                                    <li style={{ marginBottom: '6px' }}><a href="https://data.cityofnewyork.us/Education/2016-17-2020-23-Citywide-End-of-Year-Attendance-an/sgsi-66kk" style={{ color: '#394882' }}>NYC Open Data</a> -- school-level attendance and chronic absenteeism, 2016-17 through 2022-23</li>
                                    <li style={{ marginBottom: '6px' }}><a href="https://manhattan.institute/article/chronic-absenteeism-hampering-school-improvement-efforts-new-york-city" style={{ color: '#394882' }}>Manhattan Institute</a> -- chronic absenteeism analysis</li>
                                    <li style={{ marginBottom: '6px' }}><a href="https://www.empirecenter.org/publications/schools-out-forever/" style={{ color: '#394882' }}>Empire Center</a> -- attendance and enrollment analysis</li>
                                    <li style={{ marginBottom: '6px' }}><a href="https://steinhardt.nyu.edu/research-alliance/research/spotlight-nyc-schools/how-has-attendance-nyc-schools-changed-over-time" style={{ color: '#394882' }}>NYU Research Alliance for NYC Schools</a> -- historical attendance trends (2000-2018)</li>
                                    <li style={{ marginBottom: '6px' }}><a href="https://www.chalkbeat.org/newyork/" style={{ color: '#394882' }}>Chalkbeat New York</a> -- reporting on 2022-23 through 2024-25 chronic absenteeism data</li>
                                </ul>
                            </div>

                        </div>
                    </div>}

                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  <script src="../shared/chrome.js?v=14"></script>
