                        <h2 className="en-h2">
                            Methodology and data notes
                        </h2>

                        <div className="en-meth">

                            <div>
                                <h3 className="en-mh">Correction, Oct. 7, 2026</h3>
                                <p>An earlier version of this page showed annual enrollment by sector from 1940 to 2025, said the city had lost 300,000 K-12 students from a peak, and showed pre-K and grade-level figures, and student counts on the Workforce tab, that did not match official counts. None of the 1940-2025 sector figures could be traced to a source, and several later figures were rounded estimates or interpolations. The absenteeism tab said no data existed for 2019-20 (DOE published a partial-year figure, 25.1 percent), gave 40.2 percent for 2021-22 (DOE’s figure is 40.3) and a preliminary 33 percent for 2024-25 (DOE’s final figure is 33.3). Every chart now uses published counts from the New York State Education Department, the city’s Department of Education and the other sources named below, and the headlines were rewritten to match.</p>
                            </div>

                            <div>
                                <h3 className="en-mh">K-12 enrollment by type of school</h3>
                                <p><strong>Public and charter schools.</strong> Counts come from the New York State Education Department (NYSED), Information and Reporting Services, which collects enrollment on BEDS (Basic Educational Data System) Day, the first Wednesday in October. District figures add every New York City row in NYSED’s district files (state district codes beginning 30 to 35, which cover the 32 community school districts, District 75 and the citywide high school and alternative school districts), for 1976-77 through 2025-26. Charter figures add the city’s charter schools in NYSED’s school-level files; none appear before 2000-01, although the city’s oldest operating charter school, Sisulu-Walker Charter School of Harlem, opened in 1999, according to NYSED’s charter school directory. K-12 means kindergarten (half-day and full-day) through 12th grade plus ungraded students; pre-K is left out. The page adds the grade columns rather than using the files’ total column: in the 1992-93 and 1993-94 files the column labeled “K12 total” exceeds the grade columns by about 12,500, roughly the size of pre-K, and in earlier files it differs from them by less than 0.3 percent. NYSED’s school-level and district-level files give identical district totals for every year from 1999-2000 on.</p>
                                <p><strong>State and city counts differ slightly.</strong> The Department of Education (DOE) counts students on its October 31 audited register; NYSED counts on BEDS Day. For 2025-26, NYSED counts 780,402 K-12 students in district schools and DOE counts 789,918. The other tabs use DOE’s counts.</p>
                                <p><strong>Before 1976-77.</strong> NYSED’s electronic files begin in 1976-77. The federal survey cited on the tab (National Center for Education Statistics, Fall 1971, Table 4) counted 1,149,068 students in kindergarten through 12th grade in fall 1971 and 1,120,082 in fall 1970. It is a different collection, so it is not joined to the state series.</p>
                                <p><strong>Private schools.</strong> NYSED’s nonpublic enrollment files list the private schools that report to the state, with each school’s affiliation and enrollment by grade. The page adds schools in the five boroughs. “Religious” covers Catholic, Jewish and other religious affiliations; “independent” is NYSED’s nonsectarian category. Hunter College Campus Schools, which NYSED files with nonpublic schools but which are public schools run by Hunter College, are left out (1,624 K-12 students in 2025-26). Private-school counts are of schools located in the city; some students live elsewhere.</p>
                                <p><strong>Home schooling.</strong> NYSED’s count of children instructed at home, as reported by school districts, covers children of compulsory school age taught at home by parents or a tutor they hire. New York City’s figures start in 2014-15: 3,667 that year and 13,079 in 2025-26 (15,283 in 2024-25). Children younger or older than compulsory school age are not counted.</p>
                            </div>

                            <div>
                                <h3 className="en-mh">3-K and pre-K</h3>
                                <p>Counts come from DOE’s Demographic Snapshot, citywide tab including charter schools, using the newest edition that covers each year. They include half-day and full-day seats and children in NYC Early Education Centers, the community-based programs DOE contracts with. DOE notes that its October 31 counts are not audited for charter schools or those centers. In the current edition, 3-K means pre-K students who were 3 years old as of Dec. 31 of the school year. Snapshot editions for 2015-16 and 2016-17 report a single 3-K-plus-pre-K figure; 3-K for All did not exist yet, so the page treats it as pre-K.</p>
                                <p>Birth figures are births to New York City residents from the Health Department’s Summary of Vital Statistics: 123,231 in 2012 and 120,367 in 2016 (2016 edition, Table PC1), and 99,262 in 2021 and 99,459 in 2022 (2022 edition, Table PO11). An earlier version of this page gave about 123,000 births for 2016; that was the 2012 figure.</p>
                            </div>

                            <div>
                                <h3 className="en-mh">Enrollment by grade</h3>
                                <p>Grade counts, 3-K through 12th grade, come from DOE’s Demographic Snapshot, which counts students on the October 31 audited register (Nov. 13 in 2020-21 and Nov. 12 in 2021-22, when the school year started late). Each year comes from the newest edition that covers it: the 2021-22 to 2025-26 edition for 2021-22 onward; the 2020-21 to 2024-25 edition for 2020-21; the 2019-20 to 2023-24 edition for 2019-20; the 2016-17 to 2020-21 citywide file on NYC Open Data for 2016-17 to 2018-19; the 2015-16 to 2019-20 file for 2015-16; the 2014-15 to 2018-19 file for 2014-15; and the 2013-14 to 2017-18, 2012-13 to 2016-17, 2011-12 to 2015-16 and 2010-11 to 2014-15 editions for 2013-14 back to 2010-11. DOE no longer posts the 2019-20 to 2023-24 and 2020-21 to 2024-25 editions or the editions published from 2015 to 2018; those were retrieved from the Internet Archive. Where editions overlap, their citywide totals are identical. 3-K and pre-K include half-day and full-day seats and NYC Early Education Centers and match the 3-K and pre-K tab; for 2017-18 and 2018-19, when the citywide file combines them, 3-K comes from DOE’s 3-K for All snapshot on NYC Open Data.</p>
                                <p><strong>With and without charter schools.</strong> From 2019-20, DOE publishes citywide counts with and without charter schools, and the explorer uses both. Earlier editions publish only the figure that includes charters; for those years, district-school counts are that figure minus the charter-school row (District 84) of the same edition’s district file, grade by grade. In the 2019-20 edition, which publishes both, the District 84 row equals the difference between the two citywide figures (129,668 students). Charter K-12 counts on this basis run within about 2 percent of the state’s October charter counts. 3-K is the same in both views, since no charter school enrolled 3-K students in these years.</p>
                                <p>The preliminary 2026-27 point on the K-12 line (766,900 as of Oct. 31, 2026, district schools only) is from DOE’s Nov. 16, 2026, release as reported by The New York Times and NY1. It is 23,018 below the audited 2025-26 count of 789,918, the decline DOE reported, so it is on the same basis. DOE released no grade-by-grade detail, and the figure may change in the audit.</p>
                            </div>

                            <div>
                                <h3 className="en-mh">Chronic absenteeism</h3>
                                <p>A student is chronically absent when he or she misses 10 percent or more of the days enrolled, about 18 days in a 180-day year. Every figure on the tab comes from one file: NYC Public Schools' citywide End-of-Year Attendance and Chronic Absenteeism Data, 2018-19 through 2024-25, sheet "All Students," row "All Grades," column "% Chronically Absent." DOE is the Department of Education, now branded NYC Public Schools.</p>
                                <p>DOE moved to the New York State Education Department's definition in 2020-21 and applied it to every earlier year in the file: attendance of 90 percent or less, counting only students enrolled at least 10 days and present at least one. Under DOE's earlier definition, which counted students enrolled 20 or more days, the citywide rate ran between 24.5 percent and 27.0 percent from 2013-14 through 2018-19 (NYC Open Data, "Attendance Results 2013-2019"); the two definitions give the same 26.5 percent for 2018-19.</p>
                                <p>The file covers Districts 1 to 32 and District 75. It leaves out charter schools, District 79, home schooling and home and hospital instruction. "All Grades" includes pre-K students in K-12 schools; DOE added district pre-K centers starting in 2022-23 and District 75 short-term-stay schools the same year. Adding up DOE's kindergarten-through-12th-grade rows instead gives 26.0 percent in 2018-19, 39.6 percent in 2021-22 and 32.4 percent in 2024-25.</p>
                                <p>2019-20 covers only September 2019 to March 13, 2020, and 2020-21 counts remote and in-person days together, so neither year is comparable with full in-person years. They are shown in a lighter color.</p>
                            </div>

                            <div>
                                <h3 className="en-mh">Workforce</h3>
                                <p>The Workforce tab compares DOE staffing with K-12 enrollment in district schools, school years 2000-01 through 2022-23.</p>
                                <p><strong>Teachers.</strong> General-education and special-education teacher counts come from three Independent Budget Office (IBO) reports built from DOE personnel files: “Demographics and Work Experience: A Statistical Portrait of New York City’s Public School Teachers” (May 2014, Table 1) for 2000-01 through 2011-12; “New York City Public School Indicators: Teachers” (June 2017, p. 1) for 2012-13 through 2014-15; and “Roll Call: Recent Trends in Teacher Retention and Hiring in New York City Public Schools” (September 2023, p. 3) for 2015-16 through 2022-23. The 2017 report repeats the 2014 report’s figures for the years they share. An earlier version of this page filled 2012-13 through 2014-15 by straight-line interpolation; those years now use IBO’s published counts. The reports are not one continuous series, so small breaks at 2012-13 and 2015-16 are possible.</p>
                                <p><strong>Pedagogical and non-pedagogical headcount.</strong> DOE’s actual headcount as of June of each fiscal year, from the Office of Management and Budget (OMB), as charted by the City Council Finance Division in its report on the DOE Fiscal 2025 Preliminary Budget (March 2024), Charts 6 and 7. Fiscal year N is plotted at school year N-1 to N, so fiscal 2015 appears as 2014-15. The headcount covers all of DOE, including central and field offices. Later Council reports chart fiscal 2024 and 2025 without printing the values, so the series stops at fiscal 2023. The Council’s March 2026 report gives actual headcount as of January 2026, a mid-year figure: 124,570 pedagogical and 13,636 non-pedagogical.</p>
                                <p><strong>“Other pedagogical.”</strong> OMB’s pedagogical headcount minus IBO’s general-education and special-education teachers. It was 37,231 in 2014-15, 39,450 in 2015-16 and 41,006 in 2022-23. Per 1,000 K-12 students in district schools, it rose from 41.3 in 2015-16 to 51.4 in 2022-23, about 24 percent. Because the headcount is taken in June and the teacher count reflects the school year, the residual is approximate. The published sources do not itemize it by title year by year.</p>
                                <p><strong>Enrollment.</strong> The denominator is NYSED’s BEDS Day count of K-12 students in district schools, the same series as the Composition tab. An earlier version of this page used IBO endpoints with interpolated years in between and rounded figures for 2015-16 through 2022-23 whose source could not be found; it also described them as K-12 counts, although IBO’s 2000-01 and 2011-12 figures (1,105,240 and 1,041,437) include pre-K.</p>
                                <p><strong>Title counts, October 2019.</strong> From DOE’s FY 2020 October Headcount Report to the City Council (Nov. 15, 2019), which lists school-based and borough field-support staff by title. An earlier version of this page attributed these counts to the Local Law 226 staff demographics report, which reports only leadership, teachers and other staff, and its count of 1,640 principals included 14 principal administrative associates, a clerical title, and one neighborhood worker. The correct principal count is 1,625.</p>
                                <p><strong>What is not here.</strong> Charter-school staff, who are not DOE employees, and separate yearly lines for paraprofessionals, pre-K teachers or central-office staff, which the public sources do not provide on a consistent basis.</p>
                            </div>
