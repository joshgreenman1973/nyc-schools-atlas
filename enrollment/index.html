                <div style={{ fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em', color: '#707175', marginBottom: '6px' }}>{label}</div>
                <div style={{ fontSize: '32px', fontWeight: 900, letterSpacing: '-0.03em', color: color || '#050507', lineHeight: 1 }}>{value}</div>
                {detail && <div style={{ fontSize: '12px', color: '#707175', marginTop: '6px' }}>{detail}</div>}
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('composition');
            const [workforceYZero, setWorkforceYZero] = useState(false);
            const [wfProgress, setWfProgress] = useState(workforceData.length - 1);
            const [wfPlaying, setWfPlaying] = useState(false);
            const [wfIndexed, setWfIndexed] = useState(false);

            useEffect(() => {
                var raf;
                var last = performance.now();
                var maxIdx = workforceData.length - 1;
                var tick = (now) => {
                    var dt = now - last;
                    last = now;
                    setWfProgress(prev => {
                        var next = prev + (dt / 350);
                        if (next >= maxIdx) { setWfPlaying(false); return maxIdx; }
                        return next;
                    });
                    raf = requestAnimationFrame(tick);
                };
                if (wfPlaying) { last = performance.now(); raf = requestAnimationFrame(tick); }
                return () => cancelAnimationFrame(raf);
            }, [wfPlaying]);

            // Figures quoted in headlines and stat cards, computed from the data arrays above.
            var lrBy = Object.fromEntries(longRunData.map(d => [d.year, d]));
            var lrLatest = longRunData[longRunData.length - 1];
            var high1990s = lrBy['1998-99'];
            var distDrop = high1990s.district - lrLatest.district;
            var distDropPct = (distDrop / high1990s.district) * 100;
            var combinedLatest = lrLatest.district + lrLatest.charter;
            var combinedDropPct = ((high1990s.district - combinedLatest) / high1990s.district) * 100;
            var secLatest = sectorData[sectorData.length - 1];
            var secTotal = secLatest.district + secLatest.charter + secLatest.religious + secLatest.independent + (secLatest.homeschool || 0);
            var pctOf = (v) => ((v / secTotal) * 100).toFixed(1) + '%';

            var tabs = [
                { id: 'composition', label: 'Composition' },
                { id: 'prek', label: 'Pre-K & 3-K' },
                { id: 'grades', label: 'By grade' },
                { id: 'absenteeism', label: 'Absenteeism' },
                { id: 'workforce', label: 'Workforce' },
                { id: 'methodology', label: 'Methodology' },
            ];


            return (
                <div style={{ maxWidth: '960px', margin: '0 auto', padding: '24px 16px 60px' }}>
                    <div style={{ marginBottom: '40px' }}>
                        <h1 style={{ fontSize: 'clamp(28px, 5vw, 44px)', fontWeight: 900, lineHeight: 1.05, letterSpacing: '-0.03em', color: '#050507', marginBottom: '12px', maxWidth: '700px' }}>
                            New York City’s public schools were shrinking before the pandemic, and the decline sped up after it
                        </h1>
                        <p style={{ fontFamily: 'var(--font-secondary)', fontSize: 'clamp(16px, 2.5vw, 20px)', color: '#707175', lineHeight: 1.5, maxWidth: '640px' }}>
                            Fifty years of state enrollment counts, with charter, private and home-schooled students, 3-K and pre-K, chronic absenteeism and school staffing
                        </p>
                    </div>

                    <div className="custom-scrollbar" style={{ display: 'flex', flexWrap: 'wrap', borderBottom: '1px solid #ddd', marginBottom: '32px' }}>
                        {tabs.map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{
                                background: 'none', border: 'none',
                                borderBottom: activeTab === tab.id ? '3px solid #050507' : '3px solid transparent',
                                padding: '12px 20px', fontSize: '12px',
                                fontWeight: activeTab === tab.id ? 700 : 500,
                                textTransform: 'uppercase', letterSpacing: '0.08em',
                                color: activeTab === tab.id ? '#050507' : '#707175',
                                cursor: 'pointer', whiteSpace: 'nowrap', fontFamily: 'var(--font-primary)',
                            }}>{tab.label}</button>
                        ))}
                    </div>

                    {/* TAB 1: COMPOSITION - uses display toggle */}
                    <div style={{ display: activeTab === 'composition' ? 'block' : 'none' }}>
                        <h2 style={{ fontSize: '22px', fontWeight: 900, letterSpacing: '-0.02em', marginBottom: '4px' }}>
                            District public schools have lost more than a quarter of their K-12 students since 1998-99
                        </h2>
                        <p style={{ fontSize: '13px', color: '#707175', marginBottom: '24px' }}>
                            Kindergarten through 12th grade enrollment in New York City public schools, 1976-77 to 2025-26, from the state’s October counts. Charter schools appear in the state’s data starting in 2000-01.
                        </p>

                        <div style={{ display: 'flex', gap: '12px', marginBottom: '28px', flexWrap: 'wrap' }}>
                            <StatCard label={'District schools, ' + lrLatest.year} value={formatNumber(lrLatest.district)} detail={'Down ' + formatNumber(distDrop) + ' (' + distDropPct.toFixed(1) + '%) from 1998-99'} color="#8a8f1f" />
                            <StatCard label={'Charter schools, ' + lrLatest.year} value={formatNumber(lrLatest.charter)} detail="First counted by the state in 2000-01" color="#ff7c53" />
                            <StatCard label="District and charter combined" value={formatNumber(combinedLatest)} detail={combinedDropPct.toFixed(1) + '% below the 1998-99 district total'} />
                        </div>

                        <div style={{ height: '400px', width: '100%' }}>
                            <ResponsiveContainer width="100%" height="100%">
                                <AreaChart data={longRunData} margin={{ top: 10, right: 30, left: 10, bottom: 0 }}>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#eee" />
                                    <XAxis dataKey="year" ticks={['1976-77', '1985-86', '1995-96', '2005-06', '2015-16', '2025-26']} interval={0} tick={{ fill: '#707175', fontSize: 11 }} axisLine={false} tickLine={false} />
                                    <YAxis tickFormatter={formatYAxis} tick={{ fill: '#707175', fontSize: 11 }} axisLine={false} tickLine={false} width={45} domain={[0, 1200000]} ticks={[0, 300000, 600000, 900000, 1200000]} />
                                    <Tooltip content={<CustomTooltip />} />
                                    <Legend iconType="square" iconSize={10} wrapperStyle={{ paddingTop: '16px', fontSize: '12px' }} />
                                    <Area isAnimationActive={false} type="linear" dataKey="district" name="District public schools" stackId="1" stroke="#dde44c" fill="#dde44c" fillOpacity={0.9} />
                                    <Area isAnimationActive={false} type="linear" dataKey="charter" name="Charter schools" stackId="1" stroke="#ff7c53" fill="#ff7c53" fillOpacity={0.9} />
                                </AreaChart>
                            </ResponsiveContainer>
                        </div>

                        <p style={{ fontSize: '13px', color: '#505257', lineHeight: 1.6, marginTop: '16px', maxWidth: '720px' }}>
                            District enrollment bottomed out at 914,782 in 1982-83 and rose to 1,058,593 in 1998-99. It fell by 68,974 from 2010-11 to 2019-20 and by another 124,318 from 2019-20 to 2025-26. Counting charter schools, public school enrollment fell 1.5 percent from 2015-16 to 2019-20 and 10.0 percent from 2019-20 to 2025-26. A federal survey counted 1,149,068 students in kindergarten through 12th grade in fall 1971, more than in any year shown here, but it was compiled on a different basis, so it is not plotted.
                        </p>

                        <h3 style={{ fontSize: '17px', fontWeight: 900, letterSpacing: '-0.02em', marginTop: '40px', marginBottom: '4px' }}>
                            All K-12 students, by type of school, 2000-01 to 2025-26
                        </h3>
                        <p style={{ fontSize: '13px', color: '#707175', marginBottom: '20px' }}>
                            Students in public, charter and private schools located in New York City, plus home-schooled children of compulsory school age, who are counted from 2014-15 on
                        </p>

                        <div style={{ display: 'flex', gap: '12px', marginBottom: '28px', flexWrap: 'wrap' }}>
                            <StatCard label={'All K-12 students, ' + secLatest.year} value={formatNumber(secTotal)} detail="All five types combined" />
                            <StatCard label="District share" value={pctOf(secLatest.district)} detail={formatNumber(secLatest.district) + ' students'} color="#8a8f1f" />
                            <StatCard label="Charter share" value={pctOf(secLatest.charter)} detail={formatNumber(secLatest.charter) + ' students'} color="#ff7c53" />
                            <StatCard label="Private share" value={pctOf(secLatest.religious + secLatest.independent)} detail={formatNumber(secLatest.religious) + ' religious, ' + formatNumber(secLatest.independent) + ' independent'} color="#394882" />
                            <StatCard label="Home-schooled" value={pctOf(secLatest.homeschool)} detail={formatNumber(secLatest.homeschool) + ' children'} color="#e7466d" />
                        </div>

                        <div style={{ height: '420px', width: '100%' }}>
                            <ResponsiveContainer width="100%" height="100%">
                                <AreaChart data={sectorData} margin={{ top: 10, right: 30, left: 10, bottom: 0 }}>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#eee" />
                                    <XAxis dataKey="year" ticks={['2000-01', '2005-06', '2010-11', '2015-16', '2020-21', '2025-26']} interval={0} tick={{ fill: '#707175', fontSize: 11 }} axisLine={false} tickLine={false} />
                                    <YAxis tickFormatter={formatYAxis} tick={{ fill: '#707175', fontSize: 11 }} axisLine={false} tickLine={false} width={45} domain={[0, 1400000]} ticks={[0, 350000, 700000, 1050000, 1400000]} />
                                    <Tooltip content={<CustomTooltip />} />
                                    <Legend iconType="square" iconSize={10} wrapperStyle={{ paddingTop: '16px', fontSize: '12px' }} />
                                    <Area isAnimationActive={false} type="linear" dataKey="district" name="District public" stackId="1" stroke="#dde44c" fill="#dde44c" fillOpacity={0.9} />
                                    <Area isAnimationActive={false} type="linear" dataKey="charter" name="Charter" stackId="1" stroke="#ff7c53" fill="#ff7c53" fillOpacity={0.9} />
                                    <Area isAnimationActive={false} type="linear" dataKey="religious" name="Religious private" stackId="1" stroke="#394882" fill="#394882" fillOpacity={0.85} />
                                    <Area isAnimationActive={false} type="linear" dataKey="independent" name="Independent private" stackId="1" stroke="#9b9fbc" fill="#9b9fbc" fillOpacity={0.8} />
                                    <Area isAnimationActive={false} type="linear" dataKey="homeschool" name="Home-schooled" stackId="1" stroke="#e7466d" fill="#e7466d" fillOpacity={0.85} />
                                </AreaChart>
                            </ResponsiveContainer>
                        </div>

                        <p style={{ fontSize: '13px', color: '#505257', lineHeight: 1.6, marginTop: '16px', maxWidth: '720px' }}>

                        </p>

                        <div style={{ marginTop: '12px', fontSize: '11px', color: '#707175', lineHeight: 1.6 }}>

                        </div>
                    </div>

                    {/* TAB 2: EARLY CHILDHOOD */}
                    {activeTab === 'prek' && (() => {
                        var ec = earlyChildhoodData;
                        var ecBy = Object.fromEntries(ec.map(d => [d.year, d]));
                        var ecLatest = ec[ec.length - 1];
                        var maxBy = (f) => ec.reduce((m, d) => (f(d) > f(m) ? d : m));
                        var pkPeak = maxBy(d => d.preK);
                        var tkPeak = maxBy(d => d.threeK);
                        var bothPeak = maxBy(d => d.preK + d.threeK);
                        var a = ecBy['2016-17'], b = ecBy['2019-20'];
                        var earlyGain = (b.preK + b.threeK) - (a.preK + a.threeK);
                        var k12Loss = a.k12 - b.k12;
                        return <div>
                        <h2 style={{ fontSize: '22px', fontWeight: 900, letterSpacing: '-0.02em', marginBottom: '4px' }}>
                            3-K and pre-K grew while kindergarten through 12th grade shrank
                        </h2>
                        <p style={{ fontSize: '13px', color: '#707175', marginBottom: '28px' }}>
                            Children in New York City public 3-K and pre-K, half-day and full-day, including community-based centers and charter schools, 2010-11 to 2025-26
                        </p>

                        <div style={{ display: 'flex', gap: '12px', marginBottom: '28px', flexWrap: 'wrap' }}>
                            <StatCard label="Pre-K high" value={formatNumber(pkPeak.preK)} detail={pkPeak.year} color="#217ebe" />
                            <StatCard label={'Pre-K, ' + ecLatest.year} value={formatNumber(ecLatest.preK)} detail={(((ecLatest.preK - pkPeak.preK) / pkPeak.preK) * 100).toFixed(1) + '% from ' + pkPeak.year} color="#217ebe" />
                            <StatCard label={'3-K, ' + ecLatest.year} value={formatNumber(ecLatest.threeK)} detail={'High: ' + formatNumber(tkPeak.threeK) + ' in ' + tkPeak.year} color="#a0708c" />
                            <StatCard label={'Both, ' + ecLatest.year} value={formatNumber(ecLatest.preK + ecLatest.threeK)} detail={'High: ' + formatNumber(bothPeak.preK + bothPeak.threeK) + ' in ' + bothPeak.year} />
                        </div>

                        <div style={{ height: '400px', width: '100%' }}>
                            <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={earlyChildhoodData} margin={{ top: 10, right: 10, left: 10, bottom: 0 }}>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#eee" />
                                    <XAxis dataKey="year" tick={{ fill: '#707175', fontSize: 11 }} axisLine={false} tickLine={false} interval={1} />
                                    <YAxis tickFormatter={formatYAxis} tick={{ fill: '#707175', fontSize: 11 }} axisLine={false} tickLine={false} width={40} domain={[0, 100000]} ticks={[0, 25000, 50000, 75000, 100000]} />
                                    <Tooltip content={<CustomTooltip />} cursor={{ fill: 'rgba(221,228,76,0.1)' }} />
                                    <Legend iconType="square" iconSize={10} wrapperStyle={{ paddingTop: '16px', fontSize: '12px' }} />
                                    <Bar isAnimationActive={false} dataKey="preK" name="Pre-K" stackId="a" fill="#217ebe" />
                                    <Bar isAnimationActive={false} dataKey="threeK" name="3-K" stackId="a" fill="#cea9be" radius={[3, 3, 0, 0]} />
                                </BarChart>
                            </ResponsiveContainer>
                        </div>

                        <p style={{ fontSize: '13px', color: '#505257', lineHeight: 1.6, marginTop: '16px', maxWidth: '720px' }}>
                            From 2016-17 to 2019-20, 3-K and pre-K enrollment rose by {formatNumber(earlyGain)} while kindergarten through 12th grade fell by {formatNumber(k12Loss)}, so the two together fell by {formatNumber(k12Loss - earlyGain)}. Pre-K for All began in fall 2014, when the city enrolled 53,000 4-year-olds in full-day seats; the counts here also include half-day seats, which is why pre-K was already near 55,000 before the expansion. 3-K for All began in fall 2017 in District 7 in the South Bronx and District 23 in Brooklyn. The pre-K class of 2025-26 was born in 2021, when 99,262 babies were born to New York City residents; the class of 2016-17 was born in 2012, when there were 123,231 births.
                        </p>

                        <div style={{ marginTop: '12px', fontSize: '11px', color: '#707175', lineHeight: 1.6 }}>
                            <span style={{ fontWeight: 600 }}>Sources:</span>{' '}
                            New York City Department of Education (DOE), Demographic Snapshot (<a href="https://infohub.nyced.org/reports/students-and-schools/school-quality/information-and-data-overview" style={{ color: '#707175', textDecoration: 'underline' }}>2021-22 to 2025-26</a>; earlier editions on <a href="https://data.cityofnewyork.us/browse?q=demographic%20snapshot" style={{ color: '#707175', textDecoration: 'underline' }}>NYC Open Data</a>), citywide tab including charter schools. Pre-K for All: <a href="https://www.edweek.org/leadership/n-y-c-plows-forward-on-pre-k-initiative/2015/01" style={{ color: '#707175', textDecoration: 'underline' }}>Education Week, Jan. 3, 2015</a>. 3-K for All: <a href="https://www.chalkbeat.org/newyork/2017/7/18/21100699/new-york-city-s-3-k-for-all-preschool-program-starts-this-fall-here-are-five-things-we-know-so-far/" style={{ color: '#707175', textDecoration: 'underline' }}>Chalkbeat, July 18, 2017</a>. Births: New York City Health Department, Summary of Vital Statistics <a href="https://www.nyc.gov/assets/doh/downloads/pdf/vs/2016sum.pdf" style={{ color: '#707175', textDecoration: 'underline' }}>2016</a> (Table PC1) and <a href="https://www.nyc.gov/assets/doh/downloads/pdf/vs/2022sum.pdf" style={{ color: '#707175', textDecoration: 'underline' }}>2022</a> (Table PO11).
                        </div>
                    </div>;
                    })()}

                    {/* TAB 3: GRADES */}
                    {activeTab === 'grades' && (() => {
                        var sum = (key, from, to) => gradeData.slice(from, to).reduce((s, d) => s + d[key], 0);
                        var k8a = sum('y2019', 0, 9), k8b = sum('y2026', 0, 9);
                        var hsa = sum('y2019', 9, 13), hsb = sum('y2026', 9, 13);
                        var pctChg = (a, b) => (((b - a) / a) * 100).toFixed(1) + '%';
                        var kg = gradeData[0];
                        return <div>
                        <h2 style={{ fontSize: '22px', fontWeight: 900, letterSpacing: '-0.02em', marginBottom: '4px' }}>
                            Kindergarten through 8th grade lost a far larger share of students than high school
                        </h2>
                        <p style={{ fontSize: '13px', color: '#707175', marginBottom: '28px' }}>
                            Enrollment by grade in district public schools (charter schools not included), 2019-20 and 2025-26
                        </p>

                        <div style={{ display: 'flex', gap: '12px', marginBottom: '28px', flexWrap: 'wrap' }}>
                            <StatCard label="Kindergarten to 8th grade" value={pctChg(k8a, k8b)} detail={formatNumber(k8a) + ' → ' + formatNumber(k8b)} color="#e7466d" />
                            <StatCard label="9th to 12th grade" value={pctChg(hsa, hsb)} detail={formatNumber(hsa) + ' → ' + formatNumber(hsb)} color="#707175" />
                            <StatCard label="Kindergarten" value={pctChg(kg.y2019, kg.y2026)} detail={formatNumber(kg.y2019) + ' → ' + formatNumber(kg.y2026)} color="#e7466d" />
                        </div>

                        <div style={{ height: '400px', width: '100%' }}>
                            <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={gradeData} margin={{ top: 10, right: 10, left: 10, bottom: 0 }} barCategoryGap="20%">
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#eee" />
                                    <XAxis dataKey="grade" tick={{ fill: '#707175', fontSize: 11 }} axisLine={false} tickLine={false} />
                                    <YAxis tickFormatter={formatYAxis} tick={{ fill: '#707175', fontSize: 11 }} axisLine={false} tickLine={false} width={40} domain={[0, 90000]} ticks={[0, 30000, 60000, 90000]} />
                                    <Tooltip content={({ active, payload, label }) => {
                                        if (!active || !payload || !payload.length) return null;
                                        var d = payload[0].payload;
                                        return (
                                            <div style={{ background: '#050507', color: '#fff', padding: '12px 16px', fontFamily: 'var(--font-primary)', fontSize: '13px', boxShadow: '0 8px 32px rgba(0,0,0,0.24)' }}>
                                                <div style={{ fontWeight: 900, fontSize: '16px', marginBottom: '6px' }}>{label === 'K' ? 'Kindergarten' : 'Grade ' + label}</div>
                                                <div>2019-20: <strong>{formatNumber(d.y2019)}</strong></div>
                                                <div>2025-26: <strong>{formatNumber(d.y2026)}</strong></div>
                                                <div style={{ color: 'rgba(255,255,255,0.7)', marginTop: '4px' }}>Change: {pctChg(d.y2019, d.y2026)}</div>
                                            </div>
                                        );
                                    }} cursor={{ fill: 'rgba(221,228,76,0.1)' }} />
                                    <Legend iconType="square" iconSize={10} wrapperStyle={{ paddingTop: '16px', fontSize: '12px' }} />
                                    <Bar isAnimationActive={false} dataKey="y2019" name="2019-20" fill="#bbbbbb" radius={[3, 3, 0, 0]} />
                                    <Bar isAnimationActive={false} dataKey="y2026" name="2025-26" fill="#e7466d" radius={[3, 3, 0, 0]} />
                                </BarChart>
                            </ResponsiveContainer>
                        </div>

                        <p style={{ fontSize: '13px', color: '#505257', lineHeight: 1.6, marginTop: '16px', maxWidth: '720px' }}>
                            In 2025-26, every grade from kindergarten through 8th enrolled fewer students than any high school grade.
                        </p>

                        <div style={{ marginTop: '12px', fontSize: '11px', color: '#707175' }}>
                            <span style={{ fontWeight: 600 }}>Source:</span>{' '}New York City Department of Education, Demographic Snapshot, October 31 audited register. 2025-26: <a href="https://infohub.nyced.org/reports/students-and-schools/school-quality/information-and-data-overview" style={{ color: '#707175', textDecoration: 'underline' }}>2021-22 to 2025-26 edition</a>, citywide tab, which leaves out charter schools. 2019-20: the <a href="https://data.cityofnewyork.us/d/ycfm-qijh" style={{ color: '#707175', textDecoration: 'underline' }}>2019-20 citywide file</a> minus charter schools (District 84) in the <a href="https://data.cityofnewyork.us/d/8jzu-ady5" style={{ color: '#707175', textDecoration: 'underline' }}>2019-20 district file</a> on NYC Open Data.
                        </div>
                    </div>;
                    })()}

                    {/* TAB 4: CHRONIC ABSENTEEISM */}
                    {activeTab === 'absenteeism' && <div>
                        <h2 style={{ fontSize: '22px', fontWeight: 900, letterSpacing: '-0.02em', marginBottom: '4px' }}>
                            Chronic absenteeism jumped after the pandemic and is still above its 2018-19 level
                        </h2>
                        <p style={{ fontSize: '13px', color: '#707175', marginBottom: '28px' }}>
                            Percent of students in district public schools who missed 10 percent or more of the days they were enrolled, 2018-19 to 2024-25 (charter schools not included)
                        </p>

                        <div style={{ display: 'flex', gap: '12px', marginBottom: '28px', flexWrap: 'wrap' }}>
                            <StatCard label="Before the pandemic" value="26.5%" detail="2018-19, the last full school year before March 2020" color="#217ebe" />
                            <StatCard label="Post-pandemic high" value="40.3%" detail="2021-22, the first full year back in buildings" color="#e7466d" />
                            <StatCard label="Latest" value="33.3%" detail="2024-25" color="#e7466d" />
                            <StatCard label="Change from 2018-19" value="+6.8 points" detail="2024-25 compared with 2018-19" color="#707175" />
                        </div>

                        <div style={{ height: '400px', width: '100%' }}>
                            <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={absenteeismData} margin={{ top: 10, right: 10, left: 10, bottom: 0 }}>

                                nonPed: d.nonPed != null ? (d.nonPed / bases.nonPed) * 100 : null,

                                    <YAxis yAxisId="students" orientation="right" tickFormatter={wfIndexed ? (v => v.toFixed(0) + '%') : formatYAxis} tick={{ fill: '#707175', fontSize: 11 }} axisLine={false} tickLine={false} width={50} domain={wfIndexed ? [workforceYZero ? 0 : 60, 220] : (workforceYZero ? [0, 'auto'] : ['auto', 'auto'])} label={{ value: wfIndexed ? '% of first year' : 'K-12 students', angle: 90, position: 'insideRight', fill: '#707175', fontSize: 11 }} />
                                    {wfIndexed && <ReferenceLine yAxisId="staff" y={100} stroke="#bbb" strokeDasharray="2 4" />}
                                    <Tooltip wrapperStyle={{ outline: 'none' }} content={({ active, payload, label }) => {

                                        return (
                                            <div style={{ background: 'rgba(5,5,7,0.96)', color: '#fff', padding: '8px 10px', fontFamily: 'var(--font-primary)', boxShadow: '0 4px 16px rgba(0,0,0,0.24)', fontSize: '11px', lineHeight: 1.3 }}>
                                                <div style={{ fontWeight: 800, fontSize: '12px', marginBottom: '4px' }}>{label}</div>
                                                {payload.map((e, i) => (
                                                    <div key={i} style={{ display: 'flex', alignItems: 'center', marginBottom: '1px', whiteSpace: 'nowrap' }}>
                                                        <div style={{ width: '7px', height: '7px', borderRadius: '50%', background: e.color, marginRight: '6px', flexShrink: 0 }} />
                                                        <span style={{ color: 'rgba(255,255,255,0.7)', marginRight: '10px' }}>{shortName(e.name)}</span>
                                                        <span style={{ fontWeight: 700, marginLeft: 'auto', fontVariantNumeric: 'tabular-nums' }}>{wfIndexed ? e.value.toFixed(1) + '%' : e.value.toLocaleString()}</span>

                        <h3 style={{ fontSize: '17px', fontWeight: 900, letterSpacing: '-0.02em', marginTop: '40px', marginBottom: '4px' }}>

                            <ul style={{ margin: 0, paddingLeft: '18px' }}>
                                <li>Teacher counts come from three Independent Budget Office (IBO) reports built from DOE personnel files: a May 2014 brief (2000-01 to 2011-12), a June 2017 indicators report (2012-13 to 2014-15) and a September 2023 report (2015-16 to 2022-23). They cover teachers employed by DOE, including District 75 and District 79. Charter-school teachers and teachers employed by community-based pre-K centers are not DOE employees and are not counted.</li>

                                <li>For fiscal 2024, as of January 2024, OMB reported 6,605 filled early childhood pedagogical positions (8,024 budgeted), 4,441 in categorical programs and 1,515 in school support and other areas. The City Council's Finance Division describes categorical programs as federal, state and private funds, most of which go directly to schools.</li>

                    {/* TAB 6: METHODOLOGY */}
                    {activeTab === 'methodology' && <div>
                        <h2 style={{ fontSize: '22px', fontWeight: 900, letterSpacing: '-0.02em', marginBottom: '20px' }}>
                            Methodology and data notes
                        </h2>

                        <div style={{ fontSize: '14px', color: '#050507', lineHeight: 1.7, fontFamily: 'var(--font-secondary)' }}>

                            <div style={{ marginBottom: '32px' }}>
                                <h3 style={{ fontSize: '15px', fontWeight: 700, fontFamily: 'var(--font-primary)', textTransform: 'uppercase', letterSpacing: '0.06em', color: '#707175', marginBottom: '10px' }}>Correction, Oct. 7, 2026</h3>
                                <p style={{ marginBottom: '10px' }}>An earlier version of this page showed annual enrollment by sector from 1940 to 2025, said the city had lost 300,000 K-12 students from a peak, and showed pre-K and grade-level figures, and student counts on the Workforce tab, that did not match official counts. None of the 1940-2025 sector figures could be traced to a source, and several later figures were rounded estimates or interpolations. The absenteeism tab said no data existed for 2019-20 (DOE published a partial-year figure, 25.1 percent), gave 40.2 percent for 2021-22 (DOE’s figure is 40.3) and a preliminary 33 percent for 2024-25 (DOE’s final figure is 33.3). Every chart now uses published counts from the New York State Education Department, the city’s Department of Education and the other sources named below, and the headlines were rewritten to match.</p>
                            </div>

                            <div style={{ marginBottom: '32px' }}>
                                <h3 style={{ fontSize: '15px', fontWeight: 700, fontFamily: 'var(--font-primary)', textTransform: 'uppercase', letterSpacing: '0.06em', color: '#707175', marginBottom: '10px' }}>K-12 enrollment by type of school</h3>
                                <p style={{ marginBottom: '10px' }}><strong>Public and charter schools.</strong> Counts come from the New York State Education Department (NYSED), Information and Reporting Services, which collects enrollment on BEDS (Basic Educational Data System) Day, the first Wednesday in October. District figures add every New York City row in NYSED’s district files (state district codes beginning 30 to 35, which cover the 32 community school districts, District 75 and the citywide high school and alternative school districts), for 1976-77 through 2025-26. Charter figures add the city’s charter schools in NYSED’s school-level files; none appear before 2000-01, although the city’s oldest operating charter school, Sisulu-Walker Charter School of Harlem, opened in 1999, according to NYSED’s charter school directory. K-12 means kindergarten (half-day and full-day) through 12th grade plus ungraded students; pre-K is left out. The page adds the grade columns rather than using the files’ total column: in the 1992-93 and 1993-94 files the column labeled “K12 total” exceeds the grade columns by about 12,500, roughly the size of pre-K, and in earlier files it differs from them by less than 0.3 percent. NYSED’s school-level and district-level files give identical district totals for every year from 1999-2000 on.</p>
                                <p style={{ marginBottom: '10px' }}><strong>State and city counts differ slightly.</strong> The Department of Education (DOE) counts students on its October 31 audited register; NYSED counts on BEDS Day. For 2025-26, NYSED counts 780,402 K-12 students in district schools and DOE counts 789,918. The other tabs use DOE’s counts.</p>
                                <p style={{ marginBottom: '10px' }}><strong>Before 1976-77.</strong> NYSED’s electronic files begin in 1976-77. The federal survey cited on the tab (National Center for Education Statistics, Fall 1971, Table 4) counted 1,149,068 students in kindergarten through 12th grade in fall 1971 and 1,120,082 in fall 1970. It is a different collection, so it is not joined to the state series.</p>
                                <p style={{ marginBottom: '10px' }}><strong>Private schools.</strong> NYSED’s nonpublic enrollment files list the private schools that report to the state, with each school’s affiliation and enrollment by grade. The page adds schools in the five boroughs. “Religious” covers Catholic, Jewish and other religious affiliations; “independent” is NYSED’s nonsectarian category. Hunter College Campus Schools, which NYSED files with nonpublic schools but which are public schools run by Hunter College, are left out (1,624 K-12 students in 2025-26). Private-school counts are of schools located in the city; some students live elsewhere.</p>
                                <p style={{ marginBottom: '10px' }}><strong>Home schooling.</strong> NYSED’s count of children instructed at home, as reported by school districts, covers children of compulsory school age taught at home by parents or a tutor they hire. New York City’s figures start in 2014-15: 3,667 that year and 13,079 in 2025-26 (15,283 in 2024-25). Children younger or older than compulsory school age are not counted.</p>
                            </div>

                            <div style={{ marginBottom: '32px' }}>
                                <h3 style={{ fontSize: '15px', fontWeight: 700, fontFamily: 'var(--font-primary)', textTransform: 'uppercase', letterSpacing: '0.06em', color: '#707175', marginBottom: '10px' }}>3-K and pre-K</h3>
                                <p style={{ marginBottom: '10px' }}>Counts come from DOE’s Demographic Snapshot, citywide tab including charter schools, using the newest edition that covers each year. They include half-day and full-day seats and children in NYC Early Education Centers, the community-based programs DOE contracts with. DOE notes that its October 31 counts are not audited for charter schools or those centers. In the current edition, 3-K means pre-K students who were 3 years old as of Dec. 31 of the school year. Snapshot editions for 2015-16 and 2016-17 report a single 3-K-plus-pre-K figure; 3-K for All did not exist yet, so the page treats it as pre-K.</p>
                                <p>Birth figures are births to New York City residents from the Health Department’s Summary of Vital Statistics: 123,231 in 2012 and 120,367 in 2016 (2016 edition, Table PC1), and 99,262 in 2021 and 99,459 in 2022 (2022 edition, Table PO11). An earlier version of this page gave about 123,000 births for 2016; that was the 2012 figure.</p>
                            </div>

                            <div style={{ marginBottom: '32px' }}>
                                <h3 style={{ fontSize: '15px', fontWeight: 700, fontFamily: 'var(--font-primary)', textTransform: 'uppercase', letterSpacing: '0.06em', color: '#707175', marginBottom: '10px' }}>Enrollment by grade</h3>
                                <p>Grade counts are DOE’s October 31 audited register for district schools only. The 2025-26 figures are from the 2021-22 to 2025-26 Demographic Snapshot, whose citywide tab leaves out charter schools. The 2019-20 figures are DOE’s 2019-20 citywide file minus the charter-school row (District 84) in its 2019-20 district file, both on NYC Open Data; they match the charter-free citywide tab in later snapshot editions.</p>
                            </div>

                            <div style={{ marginBottom: '32px' }}>
                                <h3 style={{ fontSize: '15px', fontWeight: 700, fontFamily: 'var(--font-primary)', textTransform: 'uppercase', letterSpacing: '0.06em', color: '#707175', marginBottom: '10px' }}>Chronic absenteeism</h3>
                                <p style={{ marginBottom: '10px' }}>A student is chronically absent when he or she misses 10 percent or more of the days enrolled, about 18 days in a 180-day year. Every figure on the tab comes from one file: NYC Public Schools' citywide End-of-Year Attendance and Chronic Absenteeism Data, 2018-19 through 2024-25, sheet "All Students," row "All Grades," column "% Chronically Absent." DOE is the Department of Education, now branded NYC Public Schools.</p>
                                <p style={{ marginBottom: '10px' }}>DOE moved to the New York State Education Department's definition in 2020-21 and applied it to every earlier year in the file: attendance of 90 percent or less, counting only students enrolled at least 10 days and present at least one. Under DOE's earlier definition, which counted students enrolled 20 or more days, the citywide rate ran between 24.5 percent and 27.0 percent from 2013-14 through 2018-19 (NYC Open Data, "Attendance Results 2013-2019"); the two definitions give the same 26.5 percent for 2018-19.</p>
                                <p style={{ marginBottom: '10px' }}>The file covers Districts 1 to 32 and District 75. It leaves out charter schools, District 79, home schooling and home and hospital instruction. "All Grades" includes pre-K students in K-12 schools; DOE added district pre-K centers starting in 2022-23 and District 75 short-term-stay schools the same year. Adding up DOE's kindergarten-through-12th-grade rows instead gives 26.0 percent in 2018-19, 39.6 percent in 2021-22 and 32.4 percent in 2024-25.</p>
                                <p>2019-20 covers only September 2019 to March 13, 2020, and 2020-21 counts remote and in-person days together, so neither year is comparable with full in-person years. They are shown in a lighter color.</p>
                            </div>

                            <div style={{ marginBottom: '32px' }}>
                                <h3 style={{ fontSize: '15px', fontWeight: 700, fontFamily: 'var(--font-primary)', textTransform: 'uppercase', letterSpacing: '0.06em', color: '#707175', marginBottom: '10px' }}>Workforce</h3>
                                <p style={{ marginBottom: '10px' }}>The Workforce tab compares DOE staffing with K-12 enrollment in district schools, school years 2000-01 through 2022-23.</p>
                                <p style={{ marginBottom: '10px' }}><strong>Teachers.</strong> General-education and special-education teacher counts come from three Independent Budget Office (IBO) reports built from DOE personnel files: “Demographics and Work Experience: A Statistical Portrait of New York City’s Public School Teachers” (May 2014, Table 1) for 2000-01 through 2011-12; “New York City Public School Indicators: Teachers” (June 2017, p. 1) for 2012-13 through 2014-15; and “Roll Call: Recent Trends in Teacher Retention and Hiring in New York City Public Schools” (September 2023, p. 3) for 2015-16 through 2022-23. The 2017 report repeats the 2014 report’s figures for the years they share. An earlier version of this page filled 2012-13 through 2014-15 by straight-line interpolation; those years now use IBO’s published counts. The reports are not one continuous series, so small breaks at 2012-13 and 2015-16 are possible.</p>
                                <p style={{ marginBottom: '10px' }}><strong>Pedagogical and non-pedagogical headcount.</strong> DOE’s actual headcount as of June of each fiscal year, from the Office of Management and Budget (OMB), as charted by the City Council Finance Division in its report on the DOE Fiscal 2025 Preliminary Budget (March 2024), Charts 6 and 7. Fiscal year N is plotted at school year N-1 to N, so fiscal 2015 appears as 2014-15. The headcount covers all of DOE, including central and field offices. Later Council reports chart fiscal 2024 and 2025 without printing the values, so the series stops at fiscal 2023. The Council’s March 2026 report gives actual headcount as of January 2026, a mid-year figure: 124,570 pedagogical and 13,636 non-pedagogical.</p>
                                <p style={{ marginBottom: '10px' }}><strong>“Other pedagogical.”</strong> OMB’s pedagogical headcount minus IBO’s general-education and special-education teachers. It was 37,231 in 2014-15, 39,450 in 2015-16 and 41,006 in 2022-23. Per 1,000 K-12 students in district schools, it rose from 41.3 in 2015-16 to 51.4 in 2022-23, about 24 percent. Because the headcount is taken in June and the teacher count reflects the school year, the residual is approximate. The published sources do not itemize it by title year by year.</p>
                                <p style={{ marginBottom: '10px' }}><strong>Enrollment.</strong> The denominator is NYSED’s BEDS Day count of K-12 students in district schools, the same series as the Composition tab. An earlier version of this page used IBO endpoints with interpolated years in between and rounded figures for 2015-16 through 2022-23 whose source could not be found; it also described them as K-12 counts, although IBO’s 2000-01 and 2011-12 figures (1,105,240 and 1,041,437) include pre-K.</p>
                                <p style={{ marginBottom: '10px' }}><strong>Title counts, October 2019.</strong> From DOE’s FY 2020 October Headcount Report to the City Council (Nov. 15, 2019), which lists school-based and borough field-support staff by title. An earlier version of this page attributed these counts to the Local Law 226 staff demographics report, which reports only leadership, teachers and other staff, and its count of 1,640 principals included 14 principal administrative associates, a clerical title, and one neighborhood worker. The correct principal count is 1,625.</p>
                                <p><strong>What is not here.</strong> Charter-school staff, who are not DOE employees, and separate yearly lines for paraprofessionals, pre-K teachers or central-office staff, which the public sources do not provide on a consistent basis.</p>
                            </div>
